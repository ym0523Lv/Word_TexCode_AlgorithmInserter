<!doctype html><html><head><meta charset="UTF-8"/><title>算法伪代码排版神器</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font-family:'Segoe UI',"Microsoft YaHei",sans-serif;padding:12px;margin:0;background-color:#f3f2f1;color:#323130}.card{background-color:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:12px}h2{font-size:15px;margin-top:0;color:#0078d4;margin-bottom:16px;font-weight:600;border-bottom:1px solid #edebe9;padding-bottom:8px}.row{display:flex;gap:10px;margin-bottom:12px}.col{flex:1;display:flex;flex-direction:column}label{font-size:11px;font-weight:600;color:#605e5c;margin-bottom:4px}input[type=text],select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #8a8886;border-radius:4px;font-size:12px}input:focus,select:focus,textarea:focus{border-color:#0078d4;outline:0}input[type=color]{width:100%;height:28px;padding:0;border:1px solid #8a8886;border-radius:4px;cursor:pointer}textarea{width:100%;height:200px;box-sizing:border-box;padding:8px;border:1px solid #8a8886;border-radius:4px;font-family:Consolas,monospace;font-size:12px;white-space:pre;line-height:1.3;margin-bottom:12px}.btn{border:none;padding:10px;width:100%;font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;margin-bottom:8px;transition:background-color .2s}.btn-primary{background-color:#0078d4;color:#fff;box-shadow:0 2px 4px rgba(0,120,212,.3)}.btn-primary:hover{background-color:#106ebe}.btn-success{background-color:#107c10;color:#fff;display:none;box-shadow:0 2px 4px rgba(16,124,16,.3)}.btn-success:hover{background-color:#0b5a0b}#status{font-size:12px;color:#d83b01;text-align:center;min-height:16px;font-weight:600}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body><div class="card"><h2>排版控制台</h2><div class="row"><div class="col"><label>英文字体 (Font)</label> <select id="uiFont"><option value="Times New Roman" selected="selected">Times New Roman</option><option value="Consolas">Consolas</option><option value="Arial">Arial</option><option value="Cambria Math">Cambria</option></select></div><div class="col"><label>字号 (Size)</label> <select id="uiSize"><option value="9">小五 (9 pt)</option><option value="10.5" selected="selected">五号 (10.5 pt)</option><option value="12">小四 (12 pt)</option><option value="14">四号 (14 pt)</option><option value="15">小三 (15 pt)</option></select></div></div><div class="row"><div class="col"><label>绝对行距 (Spacing)</label> <select id="uiLineHeight"><option value="1.0">1.0 倍</option><option value="1.2">1.2 倍</option><option value="1.5" selected="selected">1.5 倍</option><option value="2.0">2.0 倍</option></select></div><div class="col"><label>引导竖线颜色</label> <input type="color" id="uiLineColor" value="#000000"/></div></div></div><div class="card"><label>算法标题:</label> <input id="algoTitle" value="Algorithm 1: Pseudo-code of SFSORT." style="margin-bottom:12px"/> <label>伪代码内容 (2个空格=1层缩进，自动生成竖线):</label> <textarea id="algoCode">
Input: Box: bounding boxes of objects;
Score: detection scores;
Output: Tracks: video tracks
for FrameNo &lt;- 1 to T do
  for Track in LostTracks do
    if Track.Status=Central then
      LostTracks.Remove(Track);
    end
  end
end</textarea> <button id="btn-insert" class="btn btn-primary">插入新代码块</button> <button id="btn-update" class="btn btn-success">更新选中的代码块</button><div id="status"></div></div></body></html>
